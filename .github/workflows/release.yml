name: Build and Release Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Game version tag (example: v0.1.0)"
        required: true
        type: string
      assembly_csharp_url:
        description: "Direct URL to Assembly-CSharp.dll"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Crush-Crush-Cheat.sln

      - name: Download Assembly-CSharp.dll
        id: asm
        shell: pwsh
        run: |
          $targetPath = Join-Path $env:RUNNER_TEMP "Assembly-CSharp.dll"
          Invoke-WebRequest -Uri "${{ inputs.assembly_csharp_url }}" -OutFile $targetPath
          if (!(Test-Path $targetPath)) {
            throw "Failed to download Assembly-CSharp.dll"
          }
          "assembly_csharp_path=$targetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build project
        run: dotnet build OmegaWare-CrushCrush/OmegaWare-CrushCrush.csproj --configuration Release --no-restore -p:AssemblyCSharpHintPath="${{ steps.asm.outputs.assembly_csharp_path }}"

      - name: Find built plugin DLL
        id: artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem "OmegaWare-CrushCrush/bin/Release/netstandard2.0" -Filter "OmegaWare*.dll" -File | Select-Object -First 1
          if (-not $dll) {
            throw "No plugin DLL found in OmegaWare-CrushCrush/bin/Release/netstandard2.0"
          }
          "dll_path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Game Ver: ${{ inputs.tag }} | BepInEx Plugin"
          body: |
            Guide to install BepInEx can be found [here](docs.bepinex.dev/master/articles/user_guide/installation/index.html)
            You need [this](https://builds.bepinex.dev/projects/bepinex_be/755/BepInEx-Unity.Mono-win-x86-6.0.0-be.755%2B3fab71a.zip) version of BepInEx
            After BepInEx is installed put the DLL in the BepInEx plugins folder.
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.dll_path }}
